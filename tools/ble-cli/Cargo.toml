[package]
name = "stackchan-ble-cli"
version = "0.1.0"
edition = "2021"
description = "BLE settings client for stackchan-idf — X25519+AES-256-GCM session, read/write config characteristics (ongoing verification of the BLE settings interface)"
license = "BSL-1.0"

[[bin]]
name = "stackchan-ble"
path = "src/main.rs"

[dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = "1"
hex = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
